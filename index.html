<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhantomX OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Desktop Icons -->
  <div class="desktop">
    <div class="icon" onclick="openWindow('terminal-win')">
      <img src="https://img.icons8.com/fluency/48/console.png" alt="Terminal">
      <span>Terminal</span>
    </div>
    <div class="icon" onclick="openWindow('notepad-win')">
      <img src="https://img.icons8.com/fluency/48/notepad.png" alt="Notepad">
      <span>Notepad</span>
    </div>
    <div class="icon" onclick="openWindow('settings-win')">
      <img src="https://img.icons8.com/fluency/48/settings.png" alt="Settings">
      <span>Settings</span>
    </div>
  </div>

  <!-- Terminal Window -->
  <div id="terminal-win" class="window">
    <div class="window-header" onmousedown="dragMouseDown(event, 'terminal-win')">
      <span>PhantomX Terminal v2.0.1</span>
      <button class="close-btn" onclick="closeWindow('terminal-win')">🔴</button>
    </div>
    <div class="window-body terminal-body">
      <p class="term-text">PhantomX OS v2.0.1 Modern Kernel Loaded.</p>
      <p class="term-text">Type <b>help</b> or <b>about</b> to get started.</p>
      <div class="input-line">
        <span class="prompt">user@phantomx:~$</span>
        <input type="text" id="term-input" onkeydown="handleCommand(event)">
      </div>
    </div>
  </div>

  <!-- Notepad Window -->
  <div id="notepad-win" class="window hidden">
    <div class="window-header" onmousedown="dragMouseDown(event, 'notepad-win')">
      <span>Notepad</span>
      <button class="close-btn" onclick="closeWindow('notepad-win')">🔴</button>
    </div>
    <div class="window-body">
      <textarea placeholder="Type your notes here..."></textarea>
    </div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button class="start-btn">⚡ Start</button>
    <div id="clock" class="clock">00:00:00 PM</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
