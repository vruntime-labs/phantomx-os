name: Browser runtime checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'kernel.js'
      - 'script.js'
      - 'style.css'
      - 'manifest.json'
      - 'sw.js'
      - 'assets/**'
      - 'apps/**'
      - 'tests/**'
      - '.github/workflows/browser-check.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'kernel.js'
      - 'script.js'
      - 'style.css'
      - 'manifest.json'
      - 'sw.js'
      - 'assets/**'
      - 'apps/**'
      - 'tests/**'
      - '.github/workflows/browser-check.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  browser-runtime:
    name: Syntax, manifest, and browser regression checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check kernel.js
          node --check apps/app-manifests.js
          node --check apps/browser-utils.js
          node --check apps/core-apps.js
          node --check apps/simulation-data.js
          node --check apps/simulation-tools.js
          node --check app-registry.js
          node --check vfs.js
          node --check script.js
          node --check public-pages.js
          node --check sw.js
      - name: Validate web app manifest
        run: |
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); if (!m.name || !m.start_url || !m.icons?.length) process.exit(1); for (const icon of m.icons) if (!fs.existsSync(icon.src.replace(/^\.\//,''))) throw new Error('Missing PWA icon: '+icon.src);"
      - name: Validate GitHub Pages workflow YAML
        run: ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/pages.yml'); puts 'Pages workflow YAML is valid'"
      - name: Run browser regression tests
        run: node --test tests/*.test.mjs
